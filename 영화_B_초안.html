<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>영화 티어리스트 - 익명 공동 영화 평가방</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --star-gold: #fbbf24;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            background-color: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
        }

        .logo i {
            color: var(--accent-color);
        }

        .header-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .badge {
            background-color: rgba(99, 102, 241, 0.2);
            color: var(--accent-color);
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 600;
            border: 1px solid rgba(99, 102, 241, 0.3);
        }

        .badge-host {
            background-color: rgba(239, 68, 68, 0.2);
            color: var(--danger);
            border-color: rgba(239, 68, 68, 0.3);
        }

        /* Main Container */
        main {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 2rem 1.5rem;
            flex: 1;
        }

        /* Home View */
        .home-container {
            text-align: center;
            max-width: 600px;
            margin: 4rem auto;
            padding: 2.5rem;
            background: var(--card-bg);
            border-radius: 1rem;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .home-container h1 {
            font-size: 2.2rem;
            margin-bottom: 1rem;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .home-container p {
            color: var(--text-secondary);
            margin-bottom: 2rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        input[type="text"] {
            width: 100%;
            padding: 0.85rem 1rem;
            border-radius: 0.5rem;
            border: 1px solid var(--border-color);
            background-color: #0f172a;
            color: var(--text-primary);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--accent-color);
        }

        .btn {
            padding: 0.85rem 1.5rem;
            border-radius: 0.5rem;
            border: none;
            background-color: var(--accent-color);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .btn-secondary {
            background-color: #334155;
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            background-color: #475569;
        }

        .btn-danger {
            background-color: var(--danger);
        }

        .btn-danger:hover {
            background-color: var(--danger-hover);
        }

        .btn-sm {
            padding: 0.4rem 0.8rem;
            font-size: 0.875rem;
        }

        /* Room Header Info */
        .room-header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
            padding: 1.5rem;
            border-radius: 0.75rem;
            border: 1px solid var(--border-color);
            margin-bottom: 2rem;
            gap: 1rem;
        }

        .room-title-area h2 {
            font-size: 1.5rem;
            margin-bottom: 0.25rem;
        }

        .room-meta {
            font-size: 0.875rem;
            color: var(--text-secondary);
            display: flex;
            gap: 1rem;
        }

        .room-actions {
            display: flex;
            gap: 0.5rem;
        }

        /* Toolbar / Search Section */
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .search-box {
            position: relative;
            flex: 1;
            max-width: 400px;
        }

        .search-box input {
            padding-left: 2.5rem;
        }

        .search-box i {
            position: absolute;
            left: 0.9rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
        }

        /* Movie Grid & Tier List */
        .section-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .movie-card {
            background-color: var(--card-bg);
            border-radius: 0.75rem;
            border: 1px solid var(--border-color);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .movie-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
        }

        .poster-wrapper {
            position: relative;
            width: 100%;
            height: 380px;
            background-color: #0f172a;
            overflow: hidden;
        }

        .poster-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .avg-rating-badge {
            position: absolute;
            top: 0.75rem;
            right: 0.75rem;
            background-color: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(4px);
            border: 1px solid var(--border-color);
            padding: 0.3rem 0.6rem;
            border-radius: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.3rem;
            font-weight: 700;
            color: var(--star-gold);
            font-size: 0.9rem;
        }

        .movie-info {
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .movie-title {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
            color: var(--text-primary);
        }

        .movie-sub-info {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 0.75rem;
        }

        .movie-synopsis {
            font-size: 0.875rem;
            color: #cbd5e1;
            margin-bottom: 1rem;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* User Evaluation Box inside Card */
        .user-eval-box {
            margin-top: auto;
            background-color: rgba(15, 23, 42, 0.6);
            padding: 0.85rem;
            border-radius: 0.5rem;
            border: 1px solid var(--border-color);
        }

        .eval-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .star-rating {
            display: flex;
            gap: 0.25rem;
            color: #475569;
            cursor: pointer;
            font-size: 1.1rem;
        }

        .star-rating i.active {
            color: var(--star-gold);
        }

        .comment-input-group {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .comment-input {
            font-size: 0.85rem !important;
            padding: 0.4rem 0.6rem !important;
        }

        /* Comments Drawer / Public Comments List */
        .comments-section {
            margin-top: 0.75rem;
            border-top: 1px dashed var(--border-color);
            padding-top: 0.75rem;
        }

        .comments-title {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 0.4rem;
        }

        .comment-item {
            font-size: 0.825rem;
            background-color: rgba(255, 255, 255, 0.03);
            padding: 0.4rem 0.6rem;
            border-radius: 0.3rem;
            margin-bottom: 0.3rem;
            color: #e2e8f0;
            display: flex;
            justify-content: space-between;
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background-color: var(--card-bg);
            border-radius: 1rem;
            border: 1px solid var(--border-color);
            width: 90%;
            max-width: 600px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        .modal-header {
            padding: 1.25rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h3 {
            font-size: 1.2rem;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.25rem;
            cursor: pointer;
        }

        .close-btn:hover {
            color: var(--text-primary);
        }

        .modal-body {
            padding: 1.25rem;
            overflow-y: auto;
            flex: 1;
        }

        .catalog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 1rem;
        }

        .catalog-card {
            background-color: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            padding: 0.75rem;
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }

        .catalog-poster {
            width: 60px;
            height: 90px;
            object-fit: cover;
            border-radius: 0.3rem;
            background-color: #334155;
        }

        .catalog-info {
            flex: 1;
        }

        .catalog-info h4 {
            font-size: 0.95rem;
            margin-bottom: 0.2rem;
        }

        .catalog-info p {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background-color: var(--accent-color);
            color: white;
            padding: 0.75rem 1.25rem;
            border-radius: 0.5rem;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3);
            font-weight: 500;
            z-index: 2000;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .empty-state {
            text-align: center;
            padding: 4rem 1rem;
            color: var(--text-secondary);
            grid-column: 1 / -1;
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        /* Utilities */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo" id="logoBtn">
            <i class="fa-solid fa-film"></i> MovieTier
        </div>
        <div class="header-actions">
            <div id="userRoleBadge" class="badge hidden">익명 참여자</div>
        </div>
    </header>

    <!-- Main Content -->
    <main>
        <!-- View 1: Home (Create Room) -->
        <div id="homeView">
            <div class="home-container">
                <h1>영화 티어리스트 생성</h1>
                <p>친구들과 함께 영화를 추천하고 나만의 비밀 평가와 한 줄 평을 남겨보세요.</p>
                <div class="input-group">
                    <input type="text" id="roomNameInput" placeholder="평가방 제목을 입력하세요 (예: 2026 연말 영화 정산)" maxlength="30">
                    <button class="btn" id="createRoomBtn">
                        <i class="fa-solid fa-plus"></i> 평가방 생성하기
                    </button>
                </div>
            </div>
        </div>

        <!-- View 2: Room (Evaluation & Catalog) -->
        <div id="roomView" class="hidden">
            <!-- Room Info Header -->
            <div class="room-header">
                <div class="room-title-area">
                    <h2 id="roomTitleDisplay">평가방 이름</h2>
                    <div class="room-meta">
                        <span><i class="fa-solid fa-users"></i> 공동 평가 진행 중</span>
                        <span><i class="fa-solid fa-shield-halved"></i> 나의 별점은 항상 비공개</span>
                    </div>
                </div>
                <div class="room-actions">
                    <button class="btn btn-secondary btn-sm" id="shareRoomBtn">
                        <i class="fa-solid fa-share-nodes"></i> 공유 링크 복사
                    </button>
                    <button class="btn btn-danger btn-sm hidden" id="deleteRoomBtn">
                        <i class="fa-solid fa-trash"></i> 방 삭제
                    </button>
                </div>
            </div>

            <!-- Toolbar -->
            <div class="toolbar">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="roomSearchInput" placeholder="추가된 영화 중에서 검색...">
                </div>
                <button class="btn" id="openCatalogModalBtn">
                    <i class="fa-solid fa-clapperboard"></i> 영화 검색 및 추가
                </button>
            </div>

            <!-- Movie Grid -->
            <div class="section-title">
                <i class="fa-solid fa-star" style="color: var(--star-gold);"></i> 평가방 영화 목록
            </div>
            <div class="movie-grid" id="roomMovieGrid">
                <!-- Movie Cards will be inserted here dynamically -->
            </div>
        </div>
    </main>

    <!-- Modal: Default Movie Search & Add Catalog -->
    <div class="modal-overlay" id="catalogModal">
        <div class="modal">
            <div class="modal-header">
                <h3>영화 검색 및 평가방 추가</h3>
                <button class="close-btn" id="closeCatalogModalBtn">&times;</button>
            </div>
            <div class="modal-body">
                <div class="search-box" style="max-width: 100%; margin-bottom: 1.25rem;">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="catalogSearchInput" placeholder="기본 영화 목록에서 검색 (제목, 장르...)">
                </div>
                <div class="catalog-grid" id="catalogGrid">
                    <!-- Catalog Item cards dynamically loaded -->
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast">메시지가 등록되었습니다.</div>

    <script>
        /**
         * Global State & Mock DB Setup using LocalStorage
         */
        const DEFAULT_MOVIES = [
            {
                id: "m1",
                title: "파묘",
                year: 2024,
                genre: "미스터리, 공포",
                synopsis: "미국 LA, 거액의 의뢰를 받은 무당 화림과 봉길은 기이한 병이 대대로 물려내려오는 집안의 장손을 만난다. 조상의 묫자리가 화근임을 알아채고 이장을 권한다.",
                poster: "https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=400&q=80"
            },
            {
                id: "m2",
                title: "인터스텔라",
                year: 2014,
                genre: "SF, 드라마다",
                synopsis: "세계 각국의 정부와 경제가 완전히 붕괴된 미래. 시들어가는 인류를 구하기 위해 시공간의 틈을 넘어 우주를 항해하는 사람들의 이야기.",
                poster: "https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&w=400&q=80"
            },
            {
                id: "m3",
                title: "인셉션",
                year: 2010,
                genre: "액션, SF",
                synopsis: "타인의 꿈에 들어가 생각을 침투시키고 정보를 추출하는 표적 전문 도둑 코브. 그에게 불가능한 임무인 '생각을 식립'하는 작업이 주어진다.",
                poster: "https://images.unsplash.com/photo-1509198397868-475647b2a1e5?auto=format&fit=crop&w=400&q=80"
            },
            {
                id: "m4",
                title: "기생충",
                year: 2019,
                genre: "드라마, 스릴러",
                synopsis: "전원백수로 살아가던 기택네 장남 기우가 박사장네 과외선생으로 면접을 보러 가면서 시작되는 두 가족의 걷잡을 수 없는 만남.",
                poster: "https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=400&q=80"
            },
            {
                id: "m5",
                title: "라라랜드",
                year: 2016,
                genre: "로맨스, 뮤지컬",
                synopsis: "꿈을 좇는 청춘들의 열정과 사랑을 그린 영화. 재즈 피아니스트 세바스찬과 배우 지망생 미아가 만들어가는 신비롭고 아름다운 하모니.",
                poster: "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?auto=format&fit=crop&w=400&q=80"
            },
            {
                id: "m6",
                title: "서울의 봄",
                year: 2023,
                genre: "드라마",
                synopsis: "1979년 12월 12일 수도 서울에서 발생한 신군부 세력의 반란을 막기 위한 긴박했던 9시간을 그린 정통 드라마다.",
                poster: "https://images.unsplash.com/photo-1578632767115-351597cf2477?auto=format&fit=crop&w=400&q=80"
            }
        ];

        // Unique User Identifier (Anonymous) stored locally
        let currentUserId = localStorage.getItem('mt_user_id');
        if (!currentUserId) {
            currentUserId = 'user_' + Math.random().toString(36).substring(2, 9);
            localStorage.setItem('mt_user_id', currentUserId);
        }

        let activeRoomId = null;
        let isHost = false;

        // DOM Elements
        const homeView = document.getElementById('homeView');
        const roomView = document.getElementById('roomView');
        const logoBtn = document.getElementById('logoBtn');
        const createRoomBtn = document.getElementById('createRoomBtn');
        const roomNameInput = document.getElementById('roomNameInput');
        const userRoleBadge = document.getElementById('userRoleBadge');
        const roomTitleDisplay = document.getElementById('roomTitleDisplay');
        const shareRoomBtn = document.getElementById('shareRoomBtn');
        const deleteRoomBtn = document.getElementById('deleteRoomBtn');
        const roomSearchInput = document.getElementById('roomSearchInput');
        const roomMovieGrid = document.getElementById('roomMovieGrid');
        const catalogModal = document.getElementById('catalogModal');
        const openCatalogModalBtn = document.getElementById('openCatalogModalBtn');
        const closeCatalogModalBtn = document.getElementById('closeCatalogModalBtn');
        const catalogSearchInput = document.getElementById('catalogSearchInput');
        const catalogGrid = document.getElementById('catalogGrid');
        const toast = document.getElementById('toast');

        // Application Storage Helpers
        function getStorageRooms() {
            return JSON.parse(localStorage.getItem('mt_rooms') || '{}');
        }

        function saveStorageRooms(rooms) {
            localStorage.setItem('mt_rooms', JSON.stringify(rooms));
        }

        // Initialize App
        function init() {
            // Check URL query for roomId
            const urlParams = new URLSearchParams(window.location.search);
            const roomId = urlParams.get('room');

            if (roomId) {
                loadRoom(roomId);
            } else {
                showHomeView();
            }

            setupEventListeners();
        }

        function showHomeView() {
            homeView.classList.remove('hidden');
            roomView.classList.add('hidden');
            userRoleBadge.classList.add('hidden');
            activeRoomId = null;
            window.history.pushState({}, '', window.location.pathname);
        }

        // Event Listeners
        function setupEventListeners() {
            logoBtn.addEventListener('click', showHomeView);
            createRoomBtn.addEventListener('click', handleCreateRoom);
            shareRoomBtn.addEventListener('click', handleShareRoom);
            deleteRoomBtn.addEventListener('click', handleDeleteRoom);
            openCatalogModalBtn.addEventListener('click', () => {
                renderCatalog();
                catalogModal.classList.add('active');
            });
            closeCatalogModalBtn.addEventListener('click', () => {
                catalogModal.classList.remove('active');
            });
            catalogSearchInput.addEventListener('input', renderCatalog);
            roomSearchInput.addEventListener('input', renderRoomMovies);
        }

        // Toast Helper
        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        // Handle Room Creation
        function handleCreateRoom() {
            const roomTitle = roomNameInput.value.trim() || '즐거운 영화 평가방';
            const roomId = 'room_' + Math.random().toString(36).substring(2, 9);
            
            const newRoom = {
                id: roomId,
                title: roomTitle,
                hostId: currentUserId,
                createdAt: new Date().toISOString(),
                addedMovies: [], // List of movie objects added
                evaluations: {}  // Structure: { movieId: { userId: { rating: 4, comment: "..." } } }
            };

            const rooms = getStorageRooms();
            rooms[roomId] = newRoom;
            saveStorageRooms(rooms);

            roomNameInput.value = '';
            
            // Navigate to room
            const newUrl = `${window.location.pathname}?room=${roomId}`;
            window.history.pushState({ room: roomId }, '', newUrl);
            loadRoom(roomId);
            showToast('평가방이 성공적으로 생성되었습니다!');
        }

        // Load Room View
        function loadRoom(roomId) {
            const rooms = getStorageRooms();
            const room = rooms[roomId];

            if (!room) {
                alert('존재하지 않거나 삭제된 평가방입니다.');
                showHomeView();
                return;
            }

            activeRoomId = roomId;
            isHost = (room.hostId === currentUserId);

            // Update UI Header
            homeView.classList.add('hidden');
            roomView.classList.remove('hidden');
            roomTitleDisplay.textContent = room.title;

            userRoleBadge.classList.remove('hidden');
            if (isHost) {
                userRoleBadge.textContent = '방장 (Host)';
                userRoleBadge.className = 'badge badge-host';
                deleteRoomBtn.classList.remove('hidden');
            } else {
                userRoleBadge.textContent = '익명 참여자';
                userRoleBadge.className = 'badge';
                deleteRoomBtn.classList.add('hidden');
            }

            renderRoomMovies();
        }

        // Share Room Link
        function handleShareRoom() {
            const shareUrl = window.location.href;
            navigator.clipboard.writeText(shareUrl).then(() => {
                showToast('공유 링크가 클립보드에 복사되었습니다!');
            }).catch(() => {
                showToast('링크 복사 실패: ' + shareUrl);
            });
        }

        // Delete Room (Host Only)
        function handleDeleteRoom() {
            if (!isHost) return;
            if (confirm('정말로 이 평가방을 삭제하시겠습니까? 모든 평가 데이터가 삭제됩니다.')) {
                const rooms = getStorageRooms();
                delete rooms[activeRoomId];
                saveStorageRooms(rooms);
                showToast('평가방이 삭제되었습니다.');
                showHomeView();
            }
        }

        // Render Catalog in Modal
        function renderCatalog() {
            const query = catalogSearchInput.value.toLowerCase().trim();
            const rooms = getStorageRooms();
            const currentRoom = rooms[activeRoomId];
            const addedIds = (currentRoom.addedMovies || []).map(m => m.id);

            const filtered = DEFAULT_MOVIES.filter(m => 
                m.title.toLowerCase().includes(query) || 
                m.genre.toLowerCase().includes(query)
            );

            catalogGrid.innerHTML = '';

            if (filtered.length === 0) {
                catalogGrid.innerHTML = '<div style="grid-column: 1/-1; text-align:center; padding: 2rem; color: var(--text-secondary);">검색 결과가 없습니다.</div>';
                return;
            }

            filtered.forEach(movie => {
                const isAdded = addedIds.includes(movie.id);
                const item = document.createElement('div');
                item.className = 'catalog-card';
                item.innerHTML = `
                    <img src="${movie.poster}" alt="${movie.title}" class="catalog-poster" onerror="this.src='https://via.placeholder.com/60x90?text=Poster'">
                    <div class="catalog-info">
                        <h4>${movie.title}</h4>
                        <p>${movie.year} • ${movie.genre}</p>
                    </div>
                    <button class="btn btn-sm ${isAdded ? 'btn-secondary' : ''}" ${isAdded ? 'disabled' : ''} onclick="addMovieToRoom('${movie.id}')">
                        ${isAdded ? '추가됨' : '<i class="fa-solid fa-plus"></i> 추가'}
                    </button>
                `;
                catalogGrid.appendChild(item);
            });
        }

        // Add Movie to Room
        window.addMovieToRoom = function(movieId) {
            const rooms = getStorageRooms();
            const currentRoom = rooms[activeRoomId];
            const targetMovie = DEFAULT_MOVIES.find(m => m.id === movieId);

            if (!targetMovie) return;

            if (!currentRoom.addedMovies) currentRoom.addedMovies = [];
            currentRoom.addedMovies.push(targetMovie);
            saveStorageRooms(rooms);

            showToast(`'${targetMovie.title}'이(가) 방에 추가되었습니다.`);
            renderCatalog();
            renderRoomMovies();
        };

        // Calculate Average Rating & Comments for a Movie
        function getMovieStats(movieId) {
            const rooms = getStorageRooms();
            const currentRoom = rooms[activeRoomId];
            const evals = (currentRoom.evaluations && currentRoom.evaluations[movieId]) || {};

            const userKeys = Object.keys(evals);
            if (userKeys.length === 0) {
                return { avg: 0, count: 0, myEval: { rating: 0, comment: '' }, commentsList: [] };
            }

            let totalRating = 0;
            let ratingCount = 0;
            const commentsList = [];

            userKeys.forEach(uid => {
                const userEval = evals[uid];
                if (userEval.rating > 0) {
                    totalRating += userEval.rating;
                    ratingCount++;
                }
                if (userEval.comment && userEval.comment.trim() !== '') {
                    commentsList.push(userEval.comment);
                }
            });

            const avg = ratingCount > 0 ? (totalRating / ratingCount).toFixed(1) : 0;
            const myEval = evals[currentUserId] || { rating: 0, comment: '' };

            return { avg, count: ratingCount, myEval, commentsList };
        };

        // Render Room Movies List
        function renderRoomMovies() {
            const rooms = getStorageRooms();
            const currentRoom = rooms[activeRoomId];
            const query = roomSearchInput.value.toLowerCase().trim();

            if (!currentRoom || !currentRoom.addedMovies || currentRoom.addedMovies.length === 0) {
                roomMovieGrid.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-solid fa-film"></i>
                        <h3>평가방에 추가된 영화가 없습니다.</h3>
                        <p>상단의 '영화 검색 및 추가' 버튼을 눌러 공유할 영화를 추가해 보세요!</p>
                    </div>
                `;
                return;
            }

            const filtered = currentRoom.addedMovies.filter(m => 
                m.title.toLowerCase().includes(query) || 
                m.genre.toLowerCase().includes(query)
            );

            roomMovieGrid.innerHTML = '';

            if (filtered.length === 0) {
                roomMovieGrid.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <h3>검색 조건과 일치하는 영화가 없습니다.</h3>
                    </div>
                `;
                return;
            }

            filtered.forEach(movie => {
                const stats = getMovieStats(movie.id);
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.innerHTML = `
                    <div class="poster-wrapper">
                        <img src="${movie.poster}" alt="${movie.title}" class="poster-img" onerror="this.src='https://via.placeholder.com/300x400?text=No+Poster'">
                        <div class="avg-rating-badge">
                            <i class="fa-solid fa-star"></i>
                            <span>${stats.avg > 0 ? stats.avg : '평가없음'}</span>
                            <span style="font-size:0.75rem; color:var(--text-secondary); font-weight:normal;">(${stats.count}명)</span>
                        </div>
                    </div>
                    <div class="movie-info">
                        <div class="movie-title">${movie.title}</div>
                        <div class="movie-sub-info">${movie.year} • ${movie.genre}</div>
                        <div class="movie-synopsis">${movie.synopsis}</div>

                        <!-- Private User Rating Section -->
                        <div class="user-eval-box">
                            <div class="eval-header">
                                <span>내 별점 (비공개)</span>
                                <div class="star-rating" data-movie-id="${movie.id}">
                                    ${[1, 2, 3, 4, 5].map(star => `
                                        <i class="fa-${star <= stats.myEval.rating ? 'solid' : 'regular'} fa-star ${star <= stats.myEval.rating ? 'active' : ''}" 
                                           data-value="${star}"></i>
                                    `).join('')}
                                </div>
                            </div>
                            <div class="comment-input-group">
                                <input type="text" class="comment-input" id="comment-${movie.id}" 
                                       placeholder="한 줄 평 작성/수정..." value="${stats.myEval.comment || ''}">
                                <button class="btn btn-sm" onclick="saveComment('${movie.id}')">등록</button>
                            </div>
                        </div>

                        <!-- Public Comments Display (Optional view for sharing opinions) -->
                        ${stats.commentsList.length > 0 ? `
                            <div class="comments-section">
                                <div class="comments-title"><i class="fa-regular fa-comments"></i> 등록된 한 줄 평 (${stats.commentsList.length})</div>
                                ${stats.commentsList.slice(-3).map(c => `<div class="comment-item"><span>"${escapeHtml(c)}"</span></div>`).join('')}
                            </div>
                        ` : ''}
                    </div>
                `;

                roomMovieGrid.appendChild(card);
            });

            // Attach Star Click Events
            document.querySelectorAll('.star-rating').forEach(starContainer => {
                const movieId = starContainer.getAttribute('data-movie-id');
                const stars = starContainer.querySelectorAll('i');

                stars.forEach(star => {
                    star.addEventListener('click', () => {
                        const rating = parseInt(star.getAttribute('data-value'));
                        saveRating(movieId, rating);
                    });
                });
            });
        }

        // Save Rating Function
        window.saveRating = function(movieId, rating) {
            const rooms = getStorageRooms();
            const currentRoom = rooms[activeRoomId];

            if (!currentRoom.evaluations) currentRoom.evaluations = {};
            if (!currentRoom.evaluations[movieId]) currentRoom.evaluations[movieId] = {};
            if (!currentRoom.evaluations[movieId][currentUserId]) {
                currentRoom.evaluations[movieId][currentUserId] = { rating: 0, comment: '' };
            }

            currentRoom.evaluations[movieId][currentUserId].rating = rating;
            saveStorageRooms(rooms);

            showToast('내 별점이 저장되었습니다. (평균 별점에 반영됨)');
            renderRoomMovies();
        };

        // Save Comment Function
        window.saveComment = function(movieId) {
            const commentInput = document.getElementById(`comment-${movieId}`);
            const commentText = commentInput ? commentInput.value.trim() : '';

            const rooms = getStorageRooms();
            const currentRoom = rooms[activeRoomId];

            if (!currentRoom.evaluations) currentRoom.evaluations = {};
            if (!currentRoom.evaluations[movieId]) currentRoom.evaluations[movieId] = {};
            if (!currentRoom.evaluations[movieId][currentUserId]) {
                currentRoom.evaluations[movieId][currentUserId] = { rating: 0, comment: '' };
            }

            currentRoom.evaluations[movieId][currentUserId].comment = commentText;
            saveStorageRooms(rooms);

            showToast('한 줄 평이 등록/수정되었습니다.');
            renderRoomMovies();
        };

        // Utility to prevent XSS in public comments
        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;")
                      .replace(/</g, "&lt;")
                      .replace(/>/g, "&gt;")
                      .replace(/"/g, "&quot;")
                      .replace(/'/g, "&#039;");
        }

        // Run Init on Load
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
