<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>모임픽 | 함께 정하는 우리 모임</title>
<style>
:root{--ink:#20352e;--muted:#75877f;--line:#e2ece6;--bg:#f3f8f5;--purple:#27845f;--purple2:#e6f3eb;--mint:#e3f4eb;--green:#198765;--orange:#fff2df;--red:#c85b62;--white:#fff;--shadow:0 12px 35px rgba(31,72,52,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:14px}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0} .app{max-width:1180px;margin:auto;padding:26px 24px 60px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:25px}.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:23px;letter-spacing:-1px}.logo{width:38px;height:38px;border-radius:13px;background:var(--purple);color:white;display:grid;place-items:center;font-size:20px}.brand small{display:block;color:var(--muted);font-size:11px;font-weight:500;letter-spacing:0;margin-top:2px}
.top-actions{display:flex;gap:9px}.btn{padding:10px 15px;border-radius:10px;font-weight:700;transition:.15s}.primary{background:var(--purple);color:white}.primary:hover{background:#1f6f4d}.secondary{background:#fff;border:1px solid var(--line);color:var(--ink)}.soft{background:var(--purple2);color:var(--purple)}.danger{background:#fff0f1;color:var(--red)}.small{padding:7px 10px;font-size:12px}
.hero{background:linear-gradient(115deg,#247b58,#4da77a);color:#fff;border-radius:20px;padding:25px 28px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;gap:15px}.hero h1{font-size:23px;margin:0 0 7px;letter-spacing:-.8px}.hero p{margin:0;color:#e1f4e9;line-height:1.6}.hero .hero-icon{font-size:48px;opacity:.9}
.layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px;align-items:start}.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:19px;box-shadow:var(--shadow)}.sidebar{display:flex;flex-direction:column;gap:14px}.section-title{font-weight:800;font-size:15px;margin:0 0 14px}.muted{color:var(--muted)}.tiny{font-size:11px;color:var(--muted)}.group-list{display:flex;flex-direction:column;gap:7px}.group-item{padding:11px;border:1px solid var(--line);border-radius:11px;text-align:left;background:#fff;color:var(--ink);width:100%}.group-item.active{border-color:#8bc4a5;background:#f1f8f3}.group-item strong{display:block;font-size:13px;margin-bottom:4px}.group-item span{font-size:11px;color:var(--muted)}
.main{display:flex;flex-direction:column;gap:16px}.empty{padding:60px 20px;text-align:center}.empty .emoji{font-size:40px;margin-bottom:12px}.empty h2{margin:0 0 8px}.empty p{color:var(--muted);line-height:1.7}
.group-head{display:flex;justify-content:space-between;align-items:flex-start;gap:15px}.group-head h2{font-size:21px;margin:0 0 7px;letter-spacing:-.5px}.group-head p{margin:0;color:var(--muted);line-height:1.5}.tag{display:inline-flex;padding:5px 8px;border-radius:7px;background:var(--purple2);color:var(--purple);font-size:11px;font-weight:800;margin-bottom:9px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:17px}.stat{padding:13px;background:#f8f9fc;border-radius:11px}.stat span{font-size:11px;color:var(--muted)}.stat strong{display:block;font-size:21px;margin-top:5px}
.tabs{display:flex;gap:5px;border-bottom:1px solid var(--line);margin:0 0 17px;overflow:auto}.tab{background:transparent;padding:11px 13px;color:var(--muted);font-weight:700;white-space:nowrap;border-bottom:2px solid transparent}.tab.active{color:var(--purple);border-color:var(--purple)}
.calendar-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.month-label{font-size:17px;font-weight:800}.month-nav{display:flex;gap:6px}.month-nav button{background:#f4f5fa;border-radius:8px;width:30px;height:30px;font-size:17px;color:var(--ink)}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.weekday{text-align:center;font-size:11px;color:var(--muted);padding:7px 0}.day{min-height:78px;border:1px solid var(--line);border-radius:9px;background:#fff;padding:7px 5px;text-align:left;position:relative;color:var(--ink)}.day.out{opacity:.28}.day .num{font-size:12px;font-weight:700}.day.selected{background:#eaf5ee;border:1.5px solid var(--purple)}.day.candidate{background:#fbfaff}.day.confirmed{background:#e8f7f1;border-color:#9ed8c2}.day.completed{background:#f0f2f5;border-color:#d9dde5}.day .count{display:block;font-size:10px;color:var(--purple);margin-top:7px;font-weight:800}.day .mark{display:block;font-size:9px;margin-top:3px;color:var(--green);font-weight:800}.day-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.two-col{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}.list{display:flex;flex-direction:column;gap:9px}.row-item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:11px;border:1px solid var(--line);border-radius:10px}.row-item strong{display:block;font-size:13px}.row-item small{color:var(--muted);font-size:11px}.pill{font-size:10px;padding:4px 7px;border-radius:20px;background:#f1f2f6;color:#657087;white-space:nowrap}.pill.green{background:var(--mint);color:var(--green)}.pill.purple{background:var(--purple2);color:var(--purple)}
.bar-row{display:grid;grid-template-columns:75px 1fr 25px;gap:8px;align-items:center;margin:11px 0;font-size:11px}.bar-bg{height:9px;border-radius:20px;background:#f0f1f6;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,#31865f,#78bd91);border-radius:20px}.place-card{border:1px solid var(--line);border-radius:11px;padding:12px}.place-card h4{margin:0 0 4px;font-size:13px}.place-card p{margin:0 0 9px;color:var(--muted);font-size:11px;line-height:1.5}.place-card .place-foot{display:flex;justify-content:space-between;align-items:center}
input,textarea{width:100%;border:1px solid #dfe3ec;border-radius:9px;padding:11px;background:white;color:var(--ink);outline:none}input:focus,textarea:focus{border-color:#70ad8b;box-shadow:0 0 0 3px #eaf5ee}textarea{resize:vertical;min-height:75px}.field{margin-bottom:13px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}.field .hint{font-size:10px;color:var(--muted);margin-top:5px}.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:15px}
.modal-backdrop{position:fixed;inset:0;background:rgba(20,25,45,.42);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal-backdrop.show{display:flex}.modal{background:white;border-radius:17px;padding:22px;width:min(480px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 70px #151b3433}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px}.modal-head h3{margin:0;font-size:18px}.close{background:#f1f2f6;border-radius:8px;width:30px;height:30px;font-size:18px}.notice{padding:11px 12px;border-radius:10px;background:#fff7e9;color:#95611b;font-size:11px;line-height:1.6;margin-top:12px}.confirmed-list{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.confirmed-card{border:1px solid #b9e2d2;background:#f5fcf9;border-radius:12px;padding:13px}.confirmed-card h4{margin:0 0 6px;font-size:13px}.confirmed-card p{margin:0 0 8px;color:var(--muted);font-size:11px}.month-picker{display:flex;gap:8px;align-items:center;margin-bottom:14px}.month-picker input{width:auto}
.hidden{display:none!important}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#20283b;color:#fff;padding:11px 17px;border-radius:30px;font-size:12px;z-index:50;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}
@media(max-width:800px){.layout{grid-template-columns:1fr}.sidebar{order:2}.main{order:1}.two-col{grid-template-columns:1fr}.hero{padding:21px}.hero h1{font-size:20px}.day{min-height:65px;padding:5px 3px}.day .count{font-size:9px}.confirmed-list{grid-template-columns:1fr}}
@media(max-width:520px){.app{padding:16px 12px 40px}header{margin-bottom:16px}.brand{font-size:20px}.top-actions .btn{padding:8px 10px;font-size:11px}.hero .hero-icon{display:none}.panel{padding:14px}.stats{gap:6px}.stat{padding:10px}.stat strong{font-size:18px}.day{min-height:57px}.day .mark{font-size:8px}.calendar{gap:3px}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand"><div class="logo">모</div><div>모임픽<small>MOIMPICK · 함께 정하는 우리 모임</small></div></div>
  <div class="top-actions"><button class="btn secondary" onclick="openJoin()">초대 코드로 참여</button><button class="btn primary" onclick="openCreate()">＋ 모임 만들기</button></div>
</header>
<section class="hero"><div><h1>우리의 다음 만남, 모임픽으로 정해요.</h1><p>가능한 날짜를 고르고, 좋은 장소에 투표하고,<br>모두가 편한 일정으로 확정해 보세요.</p></div><div class="hero-icon">🗓️</div></section>
<div class="layout">
  <aside class="sidebar">
    <section class="panel"><h3 class="section-title">내 모임</h3><div id="groupList" class="group-list"></div><button class="btn soft" style="width:100%;margin-top:12px" onclick="openCreate()">＋ 새 모임 만들기</button></section>
    <section class="panel"><h3 class="section-title">확정 일정 관리</h3><div class="month-picker"><button class="btn secondary small" onclick="shiftConfirmedMonth(-1)">‹</button><strong id="confirmedMonth"></strong><button class="btn secondary small" onclick="shiftConfirmedMonth(1)">›</button></div><div id="confirmedSummary" class="list"></div><p class="tiny" style="margin:12px 0 0">월별 미진행 확정 일정은 최대 5개까지 가능해요.</p></section>
  </aside>
  <main class="main" id="mainContent"><section class="panel empty"><div class="emoji">👋</div><h2>모임을 시작해 볼까요?</h2><p>새 모임을 만들거나 초대 코드로 참여해<br>함께 일정을 조율해 보세요.</p><button class="btn primary" onclick="openCreate()">첫 모임 만들기</button></section></main>
</div>
</div>
<div class="modal-backdrop" id="modalBackdrop" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><h3 id="modalTitle"></h3><button class="close" onclick="closeModal()">×</button></div><div id="modalBody"></div></div></div>
<div class="toast" id="toast"></div>
<script>
const KEY='moimpick_data_v1';
let data=loadData(), currentId=data.groups[0]?.id||null, currentMonth=new Date(new Date().getFullYear(),new Date().getMonth(),1), confirmedMonth=new Date(new Date().getFullYear(),new Date().getMonth(),1), activeTab='schedule', selectedDates=new Set();
function loadData(){try{return JSON.parse(localStorage.getItem(KEY))||{groups:[]}}catch(e){return{groups:[]}}}
function save(){localStorage.setItem(KEY,JSON.stringify(data));}
function uid(){return Math.random().toString(36).slice(2,9)}
function dateKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function parseDate(s){let [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function fmt(s,weekday=true){let d=parseDate(s);return `${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()}${weekday?' ('+'일월화수목금토'[d.getDay()]+')':''}`}
function monthText(d){return `${d.getFullYear()}년 ${d.getMonth()+1}월`}
function todayKey(){return dateKey(new Date())}
function getGroup(){return data.groups.find(g=>g.id===currentId)}
function completePast(){let changed=false;data.groups.forEach(g=>g.dates.forEach(x=>{if(x.status==='confirmed'&&x.date<todayKey()){x.status='completed';changed=true}}));if(changed)save()}
function toast(msg){let el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2300)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function openModal(title,body){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modalBackdrop').classList.add('show')}
function closeModal(){document.getElementById('modalBackdrop').classList.remove('show')}
function openCreate(){openModal('새 모임 만들기',`<div class="field"><label>모임 이름 *</label><input id="newName" placeholder="예: 데이터 분석 스터디"></div><div class="field"><label>모임 소개 및 목적</label><textarea id="newDesc" placeholder="모임에 대한 간단한 소개를 입력해 주세요."></textarea></div><div class="field"><label>모임장 이름 *</label><input id="newHost" placeholder="이름을 입력해 주세요."></div><div class="field"><label>후보 날짜 선택</label><input id="newDates" type="text" placeholder="아래 날짜 추가 버튼을 눌러 등록" readonly><div style="display:flex;gap:7px;margin-top:7px"><input type="date" id="newDatePick"><button class="btn secondary small" onclick="addDateToCreate()">날짜 추가</button></div><div id="newDateChips" class="tiny" style="margin-top:8px"></div></div><div class="field"><label>장소 후보 (선택)</label><input id="newPlace" placeholder="예: 강남역 스터디룸"></div><div class="form-actions"><button class="btn secondary" onclick="closeModal()">취소</button><button class="btn primary" onclick="createGroup()">모임 생성</button></div>`)}
let createDates=[];
function addDateToCreate(){let v=document.getElementById('newDatePick').value;if(!v)return toast('날짜를 선택해 주세요.');if(!createDates.includes(v))createDates.push(v);createDates.sort();document.getElementById('newDateChips').textContent=createDates.map(fmt).join(' · ');document.getElementById('newDates').value=createDates.length+'개 날짜 선택';}
function createGroup(){let name=document.getElementById('newName').value.trim(),host=document.getElementById('newHost').value.trim();if(!name||!host)return toast('모임 이름과 모임장 이름은 필수예요.');let g={id:uid(),name,desc:document.getElementById('newDesc').value.trim(),host,created:Date.now(),members:[{id:uid(),name:host,dates:[]}],dates:createDates.map(date=>({id:uid(),date,status:'candidate'})),places:[]};let place=document.getElementById('newPlace').value.trim();if(place)g.places.push({id:uid(),name:place,address:'',desc:'',by:host,votes:[g.members[0].id]});data.groups.unshift(g);currentId=g.id;currentMonth=new Date();createDates=[];save();closeModal();render();toast('모임이 생성됐어요!')}
function openJoin(){openModal('초대 코드로 참여',`<div class="field"><label>모임 코드</label><input id="joinCode" placeholder="공유받은 모임 코드를 입력해 주세요."></div><div class="field"><label>참여자 이름</label><input id="joinName" placeholder="이름을 입력해 주세요."></div><div class="notice">이 데모는 서버 없이 브라우저에 저장됩니다. 같은 브라우저에서 모임 코드를 입력해 참여할 수 있으며, 다른 기기와 데이터가 자동 동기화되지는 않아요.</div><div class="form-actions"><button class="btn secondary" onclick="closeModal()">취소</button><button class="btn primary" onclick="joinGroup()">참여하기</button></div>`)}
function joinGroup(){let code=document.getElementById('joinCode').value.trim(),name=document.getElementById('joinName').value.trim(),g=data.groups.find(x=>x.id===code);if(!g||!name)return toast('모임 코드와 이름을 확인해 주세요.');if(g.members.some(m=>m.name===name))return toast('이미 등록된 이름이에요.');g.members.push({id:uid(),name,dates:[]});currentId=g.id;save();closeModal();render();toast('모임에 참여했어요!')}
function render(){completePast();renderSidebar();let g=getGroup();if(!g){document.getElementById('mainContent').innerHTML=`<section class="panel empty"><div class="emoji">👋</div><h2>모임을 시작해 볼까요?</h2><p>새 모임을 만들거나 초대 코드로 참여해 함께 일정을 조율해 보세요.</p><button class="btn primary" onclick="openCreate()">첫 모임 만들기</button></section>`;return}renderGroup(g)}
function renderSidebar(){document.getElementById('groupList').innerHTML=data.groups.length?data.groups.map(g=>`<button class="group-item ${g.id===currentId?'active':''}" onclick="selectGroup('${g.id}')"><strong>${esc(g.name)}</strong><span>참여자 ${g.members.length}명 · 후보 날짜 ${g.dates.length}개</span></button>`).join(''):`<p class="tiny">아직 생성한 모임이 없어요.</p>`;document.getElementById('confirmedMonth').textContent=monthText(confirmedMonth);let list=[];data.groups.forEach(g=>g.dates.filter(x=>x.status==='confirmed'&&x.date.startsWith(dateKey(confirmedMonth).slice(0,7))).forEach(x=>list.push({g,x})));document.getElementById('confirmedSummary').innerHTML=list.length?list.map(({g,x})=>`<div class="row-item"><div><strong>${fmt(x.date,false)} · ${esc(g.name)}</strong><small>${esc(x.placeName||'장소 미정')}</small></div><span class="pill green">확정</span></div>`).join(''):`<p class="tiny">이번 달 확정된 일정이 없어요.</p>`}
function selectGroup(id){currentId=id;activeTab='schedule';selectedDates.clear();render()}
function shiftConfirmedMonth(n){confirmedMonth.setMonth(confirmedMonth.getMonth()+n);renderSidebar()}
function shiftMonth(n){currentMonth.setMonth(currentMonth.getMonth()+n);render()}
function renderGroup(g){let confirmed=g.dates.filter(x=>x.status==='confirmed').length,done=g.dates.filter(x=>x.status==='completed').length;document.getElementById('mainContent').innerHTML=`
<section class="panel"><div class="group-head"><div><span class="tag">모임 코드 ${g.id}</span><h2>${esc(g.name)}</h2><p>${esc(g.desc||'모임 소개가 등록되지 않았어요.')}<br>모임장 ${esc(g.host)} · 참여자 ${g.members.length}명</p></div><button class="btn secondary small" onclick="shareGroup()">공유 링크 복사</button></div><div class="stats"><div class="stat"><span>참여자</span><strong>${g.members.length}명</strong></div><div class="stat"><span>후보 날짜</span><strong>${g.dates.filter(x=>x.status==='candidate').length}개</strong></div><div class="stat"><span>확정 / 완료</span><strong>${confirmed} / ${done}</strong></div></div><div class="notice">공유 링크는 현재 모임 코드가 포함된 주소예요. 실제 외부 사용자 간 데이터 공유·동기화는 서버가 없어 지원하지 않습니다.</div></section>
<section class="panel"><div class="tabs"><button class="tab ${activeTab==='schedule'?'active':''}" onclick="setTab('schedule')">📅 일정 조율</button><button class="tab ${activeTab==='places'?'active':''}" onclick="setTab('places')">📍 장소 투표</button><button class="tab ${activeTab==='results'?'active':''}" onclick="setTab('results')">📊 결과 보기</button><button class="tab ${activeTab==='members'?'active':''}" onclick="setTab('members')">👥 참여자</button></div><div id="tabContent"></div></section>
<section class="panel"><h3 class="section-title">확정된 모임 일정</h3><div id="groupConfirmed"></div></section>`;renderTab(g);renderGroupConfirmed(g)}
function setTab(t){activeTab=t;render()}
function renderTab(g){let el=document.getElementById('tabContent');if(activeTab==='schedule')el.innerHTML=scheduleHTML(g);if(activeTab==='places')el.innerHTML=placesHTML(g);if(activeTab==='results')el.innerHTML=resultsHTML(g);if(activeTab==='members')el.innerHTML=membersHTML(g)}
function scheduleHTML(g){let y=currentMonth.getFullYear(),m=currentMonth.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),prev=new Date(y,m,0).getDate(),cells=[];for(let i=0;i<42;i++){let n=i-first+1,d,other=false;if(n<1){d=new Date(y,m-1,prev+n);other=true}else if(n>days){d=new Date(y,m+1,n-days);other=true}else d=new Date(y,m,n);let key=dateKey(d),item=g.dates.find(x=>x.date===key),count=g.members.filter(mem=>mem.dates.includes(key)).length,cls=other?'out ':'';if(item?.status==='confirmed')cls+='confirmed';else if(item?.status==='completed')cls+='completed';else if(item)cls+='candidate';if(selectedDates.has(key))cls+=' selected';cells.push(`<button class="day ${cls}" ${other?'disabled':''} onclick="toggleMyDate('${key}')"><span class="num">${d.getDate()}</span>${item?`<span class="count">${count}/${g.members.length}명 가능</span><span class="mark">${item.status==='confirmed'?'확정':item.status==='completed'?'완료':'후보'}</span>`:''}</button>`)}return `<div class="calendar-head"><div class="month-label">${monthText(currentMonth)}</div><div class="month-nav"><button onclick="shiftMonth(-1)">‹</button><button onclick="shiftMonth(1)">›</button></div></div><div class="calendar">${['일','월','화','수','목','금','토'].map(x=>`<div class="weekday">${x}</div>`).join('')}${cells.join('')}</div><div class="day-actions"><button class="btn secondary small" onclick="openAddCandidate()">＋ 후보 날짜 추가</button><button class="btn primary small" onclick="saveMyDates()">선택 날짜 저장</button><span class="tiny" style="align-self:center">날짜를 눌러 가능한 날을 복수 선택하세요.</span></div><div class="notice">현재 브라우저에서 선택한 참여자의 일정으로 저장됩니다. 날짜 선택은 참여자별로 수정할 수 있어요.</div>`}
function toggleMyDate(key){let g=getGroup(),d=g.dates.find(x=>x.date===key);if(d?.status!=='candidate')return toast('후보 상태의 날짜만 선택할 수 있어요.');if(selectedDates.has(key))selectedDates.delete(key);else selectedDates.add(key);renderTab(g)}
function saveMyDates(){let g=getGroup();if(!g)return;let name=prompt('일정을 저장할 참여자 이름을 입력해 주세요.',g.members[0]?.name||'');if(!name)return;let mem=g.members.find(x=>x.name===name.trim());if(!mem)return toast('등록된 참여자 이름과 일치하지 않아요.');mem.dates=[...selectedDates];save();render();toast('선택한 날짜를 저장했어요.')}
function openAddCandidate(){openModal('후보 날짜 추가',`<div class="field"><label>추가할 날짜</label><input id="candidateDate" type="date" min="${todayKey()}"></div><div class="form-actions"><button class="btn secondary" onclick="closeModal()">취소</button><button class="btn primary" onclick="addCandidate()">추가하기</button></div>`)}
function addCandidate(){let v=document.getElementById('candidateDate').value,g=getGroup();if(!v)return toast('날짜를 선택해 주세요.');if(g.dates.some(x=>x.date===v))return toast('이미 등록된 날짜예요.');g.dates.push({id:uid(),date:v,status:'candidate'});g.dates.sort((a,b)=>a.date.localeCompare(b.date));save();closeModal();render();toast('후보 날짜를 추가했어요.')}
function placesHTML(g){return `<div class="two-col"><div><h3 class="section-title">장소 제안</h3><div class="field"><label>장소명 *</label><input id="placeName" placeholder="예: 강남역 스터디룸"></div><div class="field"><label>주소 (선택)</label><input id="placeAddress" placeholder="주소를 입력해 주세요."></div><div class="field"><label>설명 (선택)</label><textarea id="placeDesc" placeholder="장소의 특징이나 참고사항"></textarea></div><div class="field"><label>제안자 이름 *</label><input id="placeBy" placeholder="등록된 참여자 이름"></div><button class="btn primary small" onclick="addPlace()">장소 제안하기</button></div><div><h3 class="section-title">장소 투표 안내</h3><p class="muted" style="line-height:1.7">마음에 드는 장소에 투표해 주세요. 참여자 한 명은 장소 하나에 투표할 수 있으며, 다시 투표하면 선택이 변경됩니다.</p><div class="notice">장소 제안과 투표는 현재 브라우저에 저장됩니다.</div></div></div><div style="height:1px;background:var(--line);margin:18px 0"></div><h3 class="section-title">제안된 장소</h3><div class="list">${g.places.length?g.places.map(p=>`<div class="place-card"><h4>${esc(p.name)}</h4><p>${esc(p.address||'주소 미등록')} · ${esc(p.desc||'설명 없음')}<br>제안자: ${esc(p.by)}</p><div class="place-foot"><span class="pill purple">♥ ${p.votes.length}표</span><button class="btn ${p.votes.includes(g.members[0]?.id)?'soft':'secondary'} small" onclick="votePlace('${p.id}')">${p.votes.includes(g.members[0]?.id)?'내 투표 취소':'투표하기'}</button></div></div>`).join(''):'<p class="muted">아직 제안된 장소가 없어요.</p>'}</div>`}
function addPlace(){let g=getGroup(),name=document.getElementById('placeName').value.trim(),by=document.getElementById('placeBy').value.trim(),mem=g.members.find(x=>x.name===by);if(!name||!mem)return toast('장소명과 등록된 제안자 이름을 확인해 주세요.');g.places.push({id:uid(),name,address:document.getElementById('placeAddress').value.trim(),desc:document.getElementById('placeDesc').value.trim(),by,votes:[]});save();render();toast('장소를 제안했어요.')}
function votePlace(id){let g=getGroup(),p=g.places.find(x=>x.id===id);let name=prompt('투표할 참여자 이름을 입력해 주세요.',g.members[0]?.name||'');if(!name)return;let mem=g.members.find(x=>x.name===name.trim());if(!mem)return toast('등록된 참여자 이름과 일치하지 않아요.');if(p.votes.includes(mem.id))p.votes=p.votes.filter(x=>x!==mem.id);else{g.places.forEach(x=>x.votes=x.votes.filter(v=>v!==mem.id));p.votes.push(mem.id)}save();render();toast('투표 결과를 반영했어요.')}
function resultsHTML(g){let dates=g.dates.filter(x=>x.status!=='completed').sort((a,b)=>a.date.localeCompare(b.date)),max=Math.max(0,...dates.map(d=>g.members.filter(m=>m.dates.includes(d.date)).length));return `<h3 class="section-title">날짜별 참여 가능 인원</h3>${dates.length?dates.map(d=>{let people=g.members.filter(m=>m.dates.includes(d.date)),n=people.length;return `<div class="bar-row"><span>${fmt(d.date,false)}</span><div class="bar-bg"><div class="bar" style="width:${g.members.length?n/g.members.length*100:0}%"></div></div><strong>${n}명</strong></div><div class="tiny" style="margin:-5px 0 10px 83px">${people.length?people.map(x=>esc(x.name)).join(' · '):'아직 선택한 참여자가 없어요.'}${n===max&&n>0?' · 최다 가능':''}</div>`}).join(''):'<p class="muted">등록된 후보 날짜가 없어요.</p>'}<div style="height:1px;background:var(--line);margin:18px 0"></div><h3 class="section-title">장소별 투표 결과</h3>${g.places.length?g.places.slice().sort((a,b)=>b.votes.length-a.votes.length).map(p=>`<div class="row-item"><div><strong>${esc(p.name)}</strong><small>${esc(p.by)} 제안</small></div><span class="pill purple">${p.votes.length}표</span></div>`).join(''):'<p class="muted">장소 제안이 없어요.</p>'}<div class="notice">참여 가능 인원은 각 참여자가 저장한 날짜 선택을 기준으로 집계합니다.</div>`}
function membersHTML(g){return `<h3 class="section-title">참여자별 일정 선택 내역</h3><div class="list">${g.members.map(m=>`<div class="row-item"><div><strong>${esc(m.name)}</strong><small>${m.dates.length?m.dates.slice().sort().map(x=>fmt(x,false)).join(' · '):'선택한 날짜 없음'}</small></div><button class="btn secondary small" onclick="editMember('${m.id}')">수정</button></div>`).join('')}</div><div class="notice">일정 수정은 참여자 이름을 선택해 해당 참여자의 선택 내역을 업데이트하는 방식으로 동작합니다.</div>`}
function editMember(id){let g=getGroup(),m=g.members.find(x=>x.id===id),options=g.dates.filter(x=>x.status==='candidate').map(x=>`<label style="display:flex;gap:8px;align-items:center;padding:7px 0"><input type="checkbox" class="member-date" value="${x.date}" ${m.dates.includes(x.date)?'checked':''} style="width:auto">${fmt(x.date)}</label>`).join('');openModal(`${esc(m.name)} 일정 수정`,`<p class="muted">가능한 날짜를 선택해 주세요.</p><div style="max-height:45vh;overflow:auto">${options||'선택할 후보 날짜가 없어요.'}</div><div class="form-actions"><button class="btn secondary" onclick="closeModal()">취소</button><button class="btn primary" onclick="saveMemberDates('${id}')">저장</button></div>`)}
function saveMemberDates(id){let g=getGroup(),m=g.members.find(x=>x.id===id);m.dates=[...document.querySelectorAll('.member-date:checked')].map(x=>x.value);save();closeModal();render();toast('참여자 일정을 수정했어요.')}
function renderGroupConfirmed(g){let xs=g.dates.filter(x=>x.status==='confirmed'||x.status==='completed').sort((a,b)=>a.date.localeCompare(b.date));document.getElementById('groupConfirmed').innerHTML=xs.length?`<div class="confirmed-list">${xs.map(x=>`<div class="confirmed-card"><h4>${fmt(x.date)} ${x.status==='completed'?'· 완료':'· 확정'}</h4><p>${esc(x.placeName||'장소 미정')}</p>${x.status==='confirmed'?`<button class="btn danger small" onclick="cancelConfirm('${x.id}')">확정 취소</button>`:'<span class="pill">지난 모임</span>'}</div>`).join('')}</div>`:'<p class="muted">아직 확정된 일정이 없어요.</p>'}
function finalize(id){let g=getGroup(),x=g.dates.find(d=>d.id===id);let month=x.date.slice(0,7),count=data.groups.reduce((n,gr)=>n+gr.dates.filter(d=>d.status==='confirmed'&&d.date.slice(0,7)===month).length,0);if(count>=5)return toast(`${month.replace('-','년 ')}월의 미진행 확정 일정은 최대 5개예요.`);let place=prompt('확정할 장소명을 입력해 주세요. (비워두면 장소 미정)',g.places.slice().sort((a,b)=>b.votes.length-a.votes.length)[0]?.name||'');if(place===null)return;x.status='confirmed';x.placeName=place.trim();save();render();toast('모임 일정을 확정했어요!')}
function cancelConfirm(id){let g=getGroup(),x=g.dates.find(d=>d.id===id);if(!confirm('확정을 취소하고 후보 날짜로 되돌릴까요?'))return;x.status='candidate';delete x.placeName;save();render();toast('확정이 취소되었어요.')}
function shareGroup(){let g=getGroup();let url=location.href.split('#')[0]+'#join='+g.id; if(navigator.clipboard?.writeText){navigator.clipboard.writeText(url).then(()=>toast('공유 링크를 복사했어요.')).catch(()=>prompt('아래 링크를 복사해 주세요.',url))}else prompt('아래 링크를 복사해 주세요.',url)}
function checkHash(){let h=location.hash.match(/join=([a-z0-9]+)/i);if(h){document.getElementById('joinCode')?.setAttribute('value',h[1]);openJoin();setTimeout(()=>{let x=document.getElementById('joinCode');if(x)x.value=h[1]},50)}}
window.addEventListener('hashchange',checkHash);
render();if(location.hash.includes('join='))checkHash();
</script>
</body>
